<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
  <rect width="1100" height="480" fill="#0d1117"/>

  <text x="550" y="34" text-anchor="middle" fill="#58a6ff" font-size="24" font-weight="700">Tinytosh Wiring — XIAO ESP32-C6</text>
  <text x="550" y="56" text-anchor="middle" fill="#8b949e" font-size="13">OLED I²C display + optional TTP223 touch button</text>

  <!-- ===== OLED ===== -->
  <g transform="translate(60,140)">
    <rect x="0" y="0" width="170" height="110" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="18" y="18" width="134" height="55" rx="3" fill="#0a3d0a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="85" y="46" text-anchor="middle" fill="#22c55e" font-size="13" font-family="monospace">Tinytosh</text>
    <text x="85" y="62" text-anchor="middle" fill="#22c55e" font-size="9" font-family="monospace">--:--</text>
    <text x="85" y="95" text-anchor="middle" fill="#c9d1d9" font-size="11" font-weight="600">0.96" OLED</text>
    <rect x="20"  y="113" width="20" height="14" fill="#1f2937" stroke="#6b7280"/>
    <rect x="55"  y="113" width="20" height="14" fill="#1f2937" stroke="#6b7280"/>
    <rect x="90"  y="113" width="20" height="14" fill="#1f2937" stroke="#6b7280"/>
    <rect x="125" y="113" width="20" height="14" fill="#1f2937" stroke="#6b7280"/>
    <text x="30"  y="124" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">VCC</text>
    <text x="65"  y="124" text-anchor="middle" fill="#9ca3af" font-size="9" font-weight="700">GND</text>
    <text x="100" y="124" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="700">SCL</text>
    <text x="135" y="124" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">SDA</text>
  </g>

  <!-- ===== XIAO ESP32-C6 (vertical pin strip on left, showing all 11 D-pins) ===== -->
  <g transform="translate(480,80)">
    <rect x="0" y="0" width="240" height="240" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <rect x="180" y="65" width="55" height="22" rx="3" fill="#0d1117" stroke="#6b7280"/>
    <text x="207" y="80" text-anchor="middle" fill="#9ca3af" font-size="8">USB-C</text>
    <rect x="35" y="55" width="65" height="65" rx="3" fill="#111827" stroke="#6b7280"/>
    <text x="67" y="88" text-anchor="middle" fill="#9ca3af" font-size="8">ESP32</text>
    <text x="67" y="100" text-anchor="middle" fill="#9ca3af" font-size="8">-C6</text>
    <rect x="115" y="32" width="45" height="18" rx="2" fill="#374151" stroke="#6b7280"/>
    <text x="137" y="44" text-anchor="middle" fill="#9ca3af" font-size="7">ANT</text>
    <circle cx="140" cy="125" r="3" fill="#fbbf24"/>
    <text x="120" y="155" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="700">XIAO ESP32-C6</text>

    <!-- Pin header: D0..D10 — 11 pins -->
    <g transform="translate(-8,30)">
      <rect x="0" y="0"  width="8" height="6" fill="#1f2937" stroke="#9ca3af"/>
      <rect x="0" y="12" width="8" height="6" fill="#1f2937" stroke="#9ca3af"/>
      <rect x="0" y="24" width="8" height="6" fill="#1f2937" stroke="#9ca3af"/>
      <rect x="0" y="36" width="8" height="6" fill="#1f2937" stroke="#60a5fa" stroke-width="1.8"/>
      <rect x="0" y="48" width="8" height="6" fill="#1f2937" stroke="#9ca3af"/>
      <rect x="0" y="60" width="8" height="6" fill="#1f2937" stroke="#9ca3af"/>
      <rect x="0" y="72" width="8" height="6" fill="#1f2937" stroke="#9ca3af"/>
      <rect x="0" y="84" width="8" height="6" fill="#1f2937" stroke="#9ca3af"/>
      <rect x="0" y="96" width="8" height="6" fill="#1f2937" stroke="#9ca3af"/>
      <rect x="0" y="108" width="8" height="6" fill="#1f2937" stroke="#34d399" stroke-width="1.8"/>
      <rect x="0" y="120" width="8" height="6" fill="#1f2937" stroke="#fbbf24" stroke-width="1.8"/>
    </g>
    <g transform="translate(-44,30)" font-size="9" fill="#c9d1d9" text-anchor="end">
      <text x="32" y="5">D0</text>
      <text x="32" y="17">D1</text>
      <text x="32" y="29">D2</text>
      <text x="32" y="41" fill="#60a5fa" font-weight="700">D3 ★</text>
      <text x="32" y="53">D4</text>
      <text x="32" y="65">D5</text>
      <text x="32" y="77">D6</text>
      <text x="32" y="89">D7</text>
      <text x="32" y="101">D8</text>
      <text x="32" y="113" fill="#34d399" font-weight="700">D9 ●</text>
      <text x="32" y="125" fill="#fbbf24" font-weight="700">D10 ●</text>
    </g>

    <!-- Power pins at bottom -->
    <g transform="translate(75,220)">
      <rect x="0"  y="0" width="10" height="10" fill="#1f2937" stroke="#f87171" stroke-width="1.5"/>
      <rect x="22" y="0" width="10" height="10" fill="#1f2937" stroke="#9ca3af" stroke-width="1.5"/>
      <rect x="44" y="0" width="10" height="10" fill="#1f2937" stroke="#9ca3af"/>
      <text x="5"  y="-4" text-anchor="middle" font-size="9" fill="#f87171" font-weight="700">3V3</text>
      <text x="27" y="-4" text-anchor="middle" font-size="9" fill="#9ca3af" font-weight="700">GND</text>
      <text x="49" y="-4" text-anchor="middle" font-size="9" fill="#9ca3af">5V</text>
    </g>
  </g>

  <!-- ===== TTP223 Touch Button ===== -->
  <g transform="translate(900,170)">
    <rect x="0" y="0" width="130" height="100" rx="8" fill="#7c2d12" stroke="#ea580c" stroke-width="2"/>
    <circle cx="65" cy="32" r="16" fill="#1f2937" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="65" y="37" text-anchor="middle" fill="#fbbf24" font-size="12">⊕</text>
    <text x="65" y="78" text-anchor="middle" fill="#c9d1d9" font-size="10" font-weight="600">TTP223 (optional)</text>
    <rect x="20" y="103" width="14" height="14" fill="#1f2937" stroke="#6b7280"/>
    <rect x="48" y="103" width="14" height="14" fill="#1f2937" stroke="#6b7280"/>
    <rect x="76" y="103" width="14" height="14" fill="#1f2937" stroke="#6b7280"/>
    <text x="27" y="114" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">VCC</text>
    <text x="55" y="114" text-anchor="middle" fill="#9ca3af" font-size="9" font-weight="700">GND</text>
    <text x="83" y="114" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="700">SIG</text>
  </g>

  <!-- WIRES -->
  <!-- SDA GREEN (OLED → XIAO D9=GPIO20) -->
  <path d="M 195 267 L 472 220" stroke="#34d399" stroke-width="3" fill="none"/>
  <rect x="220" y="226" width="180" height="20" rx="4" fill="#0d1117" stroke="#34d399"/>
  <text x="310" y="241" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">SDA → D9 (GPIO20)</text>

  <!-- SCL YELLOW (OLED → XIAO D10=GPIO18) -->
  <path d="M 160 267 L 472 232" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <rect x="220" y="248" width="190" height="20" rx="4" fill="#0d1117" stroke="#fbbf24"/>
  <text x="315" y="263" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">SCL → D10 (GPIO18)</text>

  <!-- Touch SIG BLUE (TTP223 → XIAO D3=GPIO21) -->
  <path d="M 900 287 L 472 198" stroke="#60a5fa" stroke-width="3" fill="none"/>
  <rect x="650" y="278" width="200" height="20" rx="4" fill="#0d1117" stroke="#60a5fa"/>
  <text x="750" y="293" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700">SIG → D3 (GPIO21) ★</text>

  <!-- VCC RED (OLED → XIAO 3V3) -->
  <path d="M 90 277 C 90 360, 400 360, 555 315" stroke="#f87171" stroke-width="3" fill="none"/>
  <text x="220" y="356" fill="#f87171" font-size="12" font-weight="700">VCC → 3V3 power</text>

  <!-- GND BLACK (OLED → XIAO GND) -->
  <path d="M 125 277 C 125 380, 400 380, 577 315" stroke="#9ca3af" stroke-width="3" fill="none"/>
  <text x="220" y="378" fill="#c9d1d9" font-size="12" font-weight="700">GND → GND ground</text>

  <!-- TTP223 VCC + GND -->
  <path d="M 920 287 C 850 287, 700 340, 555 305" stroke="#7f1d1d" stroke-width="2.5" stroke-dasharray="5 3" fill="none"/>
  <text x="660" y="335" fill="#f87171" font-size="11">TTP223 VCC → same 3V3</text>

  <path d="M 948 287 C 850 287, 700 400, 577 305" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="5 3" fill="none"/>
  <text x="660" y="395" fill="#9ca3af" font-size="11">TTP223 GND → same GND</text>

  <!-- LEGEND -->
  <g transform="translate(60,420)">
    <rect x="0" y="0" width="980" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="18" fill="#c9d1d9" font-size="11" font-weight="700">WIRE COLOR KEY</text>
    <text x="20" y="36" font-size="11">
      <tspan fill="#f87171" font-weight="700">RED</tspan> = VCC (+3.3V)
      <tspan fill="#9ca3af" font-weight="700">  BLACK</tspan> = GND
      <tspan fill="#fbbf24" font-weight="700">  YELLOW</tspan> = SCL (I²C clock → D10/GPIO18)
      <tspan fill="#34d399" font-weight="700">  GREEN</tspan> = SDA (I²C data → D9/GPIO20)
      <tspan fill="#60a5fa" font-weight="700">  BLUE</tspan> = Touch SIG → D3/GPIO21
    </text>
  </g>

  <!-- Warning -->
  <text x="60" y="478" fill="#fbbf24" font-size="10" font-weight="700">⚠</text>
  <text x="78" y="478" fill="#c9d1d9" font-size="10">Use 3.3V (NOT 5V) for OLED and TTP223. XIAO C6 GPIO is 3.3V logic — 5V will damage the chip.</text>
</svg>